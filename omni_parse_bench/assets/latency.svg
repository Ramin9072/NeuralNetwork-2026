<text class="num" x="56" y="309.333" text-anchor="end">85</text>
<line x1="64" x2="610" y1="198.7" y2="198.7" stroke="#e9ebf0"/>
<text class="num" x="56" y="202.667" text-anchor="end">90</text>
<line x1="64" x2="610" y1="92.0" y2="92.0" stroke="#e9ebf0"/>
<text class="num" x="56" y="96" text-anchor="end">95</text>
<line x1="64.0" x2="64.0" y1="92" y2="412" stroke="#e9ebf0"/>
<text class="num" x="64" y="430" text-anchor="middle">0</text>
<line x1="142.0" x2="142.0" y1="92" y2="412" stroke="#e9ebf0"/>
<text class="num" x="142" y="430" text-anchor="middle">5</text>
<line x1="220.0" x2="220.0" y1="92" y2="412" stroke="#e9ebf0"/>
<text class="num" x="220" y="430" text-anchor="middle">10</text>
<line x1="298.0" x2="298.0" y1="92" y2="412" stroke="#e9ebf0"/>
<text class="num" x="298" y="430" text-anchor="middle">15</text>
<line x1="376.0" x2="376.0" y1="92" y2="412" stroke="#e9ebf0"/>
<text class="num" x="376" y="430" text-anchor="middle">20</text>
<line x1="454.0" x2="454.0" y1="92" y2="412" stroke="#e9ebf0"/>
<text class="num" x="454" y="430" text-anchor="middle">25</text>
<line x1="532.0" x2="532.0" y1="92" y2="412" stroke="#e9ebf0"/>
<text class="num" x="532" y="430" text-anchor="middle">30</text>
<line x1="610.0" x2="610.0" y1="92" y2="412" stroke="#e9ebf0"/>
<text class="num" x="610" y="430" text-anchor="middle">35</text>
<text class="cap" x="337" y="452" text-anchor="middle">median seconds per page</text>
<text class="cap" transform="translate(20 252) rotate(-90)" text-anchor="middle">headline</text>
<polyline points="101.4,347.1 109.2,347.1 109.2,208.9 157.6,208.9 157.6,181.8 214.5,181.8 214.5,165.1 294.1,165.1 294.1,136.4 610.0,136.4" fill="none" stroke="#595e66" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="393.2" cy="136.9" r="4.5" fill="#f9fafd" stroke="#9a9fa7" stroke-width="1.5"/>
<text class="cap halo" x="402.16" y="140.912" text-anchor="start" style="fill:#9a9fa7">Gemini 3.8 Flash*</text>
<circle cx="294.1" cy="136.4" r="5" fill="#001dbe"/>
<text class="nm halo" x="285.1" y="140.369" text-anchor="end" style="fill:#001dbe">Datalab accurate</text>

<text class="nm halo" x="118.24" y="212.934" text-anchor="start">Mistral OCR</text>
<circle cx="254.3" cy="227.0" r="4.5" fill="#f9fafd" stroke="#9a9fa7" stroke-width="1.5"/>
<text class="cap halo" x="263.32" y="230.956" text-anchor="start" style="fill:#9a9fa7">Claude Sonnet 5.5*</text>
<circle cx="519.5" cy="244.9" r="5" fill="#3a3d44"/>
<text class="nm halo" x="528.52" y="248.906" text-anchor="start">GPT-5.6 Sol</text>
<circle cx="262.1" cy="340.7" r="5" fill="#3a3d44"/>
<text class="nm halo" x="271.12" y="344.694" text-anchor="start">Extend</text>
<circle cx="101.4" cy="347.1" r="5" fill="#3a3d44"/>
<text class="nm halo" x="110.44" y="351.141" text-anchor="start">Azure</text>
<text class="cap" x="24" y="482" text-anchor="start">* Used in creating and verifying at least some tests.</text>
</svg>
